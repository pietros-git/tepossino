<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pinyin Studio Direct</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --tone-1: #f87171;
      --tone-2: #4ade80;
      --tone-3: #60a5fa;
      --tone-4: #c084fc;
      --tone-5: #94a3b8;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    
    .input-box {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    textarea {
      width: 100%;
      height: 90px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 1rem;
      resize: vertical;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .speed-selector { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: #0f172a;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .btn-main {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Modal Impostazioni / API Key */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-card input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-sizing: border-box;
      margin: 12px 0 16px 0;
      font-family: monospace;
      font-size: 0.85rem;
    }

    /* Risultati e Ruby */
    .cards { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--border);
    }
    .chinese-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: flex-end;
      line-height: 2.2;
    }
    ruby {
      font-size: 1.6rem;
      color: var(--text-main);
      ruby-position: over;
      cursor: pointer;
    }
    rt {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }
    .t1 { color: var(--tone-1) !important; }
    .t2 { color: var(--tone-2) !important; }
    .t3 { color: var(--tone-3) !important; }
    .t4 { color: var(--tone-4) !important; }
    .t5 { color: var(--tone-5) !important; }

    .translation {
      font-size: 0.95rem;
      color: var(--text-dim);
      border-top: 1px solid #273549;
      padding-top: 8px;
    }
    .play-btn {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 5px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pinyin Studio Direct</h1>
    <button class="btn" onclick="openKeyModal()">⚙️ Imposta API</button>
  </header>

  <div class="input-box">
    <textarea id="raw-chinese" placeholder="Incolla o digita il testo cinese qui..."></textarea>
    <div class="controls-row">
      <div class="speed-selector">
        <button class="btn" onclick="setSpeed(0.5, this)">0.5x</button>
        <button class="btn active" onclick="setSpeed(0.75, this)">0.75x</button>
        <button class="btn" onclick="setSpeed(1.0, this)">1.0x</button>
      </div>
      <button id="process-btn" class="btn-main" onclick="processText()">Elabora con AI</button>
    </div>
  </div>

  <div id="content" class="cards">
    <div id="status-msg" style="text-align: center; color: var(--text-dim); margin-top: 30px;">
      Nessun testo elaborato.
    </div>
  </div>

  <!-- Modal Impostazioni Touch per iOS -->
  <div id="key-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top: 0; font-size: 1.1rem;">Configura API OpenRouter</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px;">
        La chiave viene salvata esclusivamente sul dispositivo locale.
      </p>
      <input type="password" id="api-key-input" placeholder="sk-or-v1-..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeKeyModal()">Annulla</button>
        <button class="btn-main" onclick="saveApiKey()">Salva Chiave</button>
      </div>
    </div>
  </div>

  <script>
    let currentPlaybackRate = 0.75;
    let fallbackApiKey = "";

    // Gestione memoria sicura per Safari iOS
    function safeStorageGet(key) {
      try {
        return localStorage.getItem(key) || fallbackApiKey;
      } catch (e) {
        return fallbackApiKey;
      }
    }

    function safeStorageSet(key, value) {
      fallbackApiKey = value;
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.warn("Storage locale limitato su iOS, salvataggio in memoria temporanea.");
      }
    }

    function openKeyModal() {
      const current = safeStorageGet('openrouter_api_key');
      document.getElementById('api-key-input').value = current || '';
      document.getElementById('key-modal').classList.add('active');
    }

    function closeKeyModal() {
      document.getElementById('key-modal').classList.remove('active');
    }

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if (val) {
        safeStorageSet('openrouter_api_key', val);
      }
      closeKeyModal();
    }

    function setSpeed(rate, el) {
      currentPlaybackRate = rate;
      document.querySelectorAll('.speed-selector .btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function getToneClass(pinyin) {
      if (/[āēīōūǖ]/.test(pinyin)) return 't1';
      if (/[áéíóúǘ]/.test(pinyin)) return 't2';
      if (/[ǎěǐǒǔǚ]/.test(pinyin)) return 't3';
      if (/[àèìòùǜ]/.test(pinyin)) return 't4';
      return 't5';
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = currentPlaybackRate;
      window.speechSynthesis.speak(utterance);
    }

    async function processText() {
      const text = document.getElementById('raw-chinese').value.trim();
      if (!text) return;

      const apiKey = safeStorageGet('openrouter_api_key');
      if (!apiKey) {
        openKeyModal();
        return;
      }

      const btn = document.getElementById('process-btn');
      btn.disabled = true;
      btn.innerText = "Attendi...";

      const prompt = `Segmenta questo testo cinese in parole con pinyin con accenti e traduzione in italiano.
Rispondi RIGOROSAMENTE ed ESCLUSIVAMENTE con un JSON senza alcun testo o commento markdown:
[
  {
    "t": [{"h": "汉字", "p": "hàn zì"}],
    "m": "Traduzione in italiano"
  }
]
Testo da analizzare:
${text}`;

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "Pinyin Studio iOS"
          },
          body: JSON.stringify({
            model: "google/gemini-2.5-flash",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.1
          })
        });

        if (!response.ok) {
          throw new Error("Errore API HTTP " + response.status);
        }

        const data = await response.json();
        let rawContent = data.choices[0].message.content.trim();
        rawContent = rawContent.replace(/^```json/i, '').replace(/```$/g, '').trim();

        const parsed = JSON.parse(rawContent);
        renderOutput(parsed);
      } catch (err) {
        alert("Errore: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Elabora con AI";
      }
    }

    function renderOutput(data) {
      const container = document.getElementById('content');
      container.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const line = document.createElement('div');
        line.className = 'chinese-line';

        let fullSentence = '';
        item.t.forEach(token => {
          fullSentence += token.h;
          const ruby = document.createElement('ruby');
          const toneClass = getToneClass(token.p);
          ruby.innerHTML = `${token.h}<rt class="${toneClass}">${token.p}</rt>`;
          ruby.onclick = () => speak(token.h);
          line.appendChild(ruby);
        });

        const trans = document.createElement('div');
        trans.className = 'translation';
        trans.textContent = item.m;

        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn';
        playBtn.innerHTML = '🔊 Ascolta frase';
        playBtn.onclick = () => speak(fullSentence);

        card.appendChild(line);
        card.appendChild(trans);
        card.appendChild(playBtn);
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
